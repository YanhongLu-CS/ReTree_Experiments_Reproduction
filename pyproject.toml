[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retree-reproduction"
version = "0.1.0"
description = "Reproduction harness for ReTree-style self-correcting long-horizon search agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "tenacity>=8.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
datasets = ["datasets>=2.20"]
dev = ["pytest>=8.2"]

[project.scripts]
retree = "retree.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
